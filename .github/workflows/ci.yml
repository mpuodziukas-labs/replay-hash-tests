name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the replay harness (the claim)
        run: python replay.py

      - name: Run tests (determinism + size + zero-divergence)
        run: pytest -q

      - name: Mutation check (every mutant must be killed)
        run: python mutants.py

      - name: Pinned hash must not move unannounced (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          # Run the checker as it exists on the base branch, so the PR cannot weaken it.
          if git show "origin/$BASE:check_reference.py" > "$RUNNER_TEMP/check_reference.py" 2>/dev/null; then
            cp "$RUNNER_TEMP/check_reference.py" ./check_reference_base.py
            python check_reference_base.py --base "origin/$BASE"
          else
            python check_reference.py --base "origin/$BASE"
          fi
